name: Test JavaScript

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Test JavaScript
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test
